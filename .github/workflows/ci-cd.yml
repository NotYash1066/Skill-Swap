name: SkillSwap - CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-server:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci

      - name: Lint server
        run: npm run lint

      - name: Run server tests
        run: npm test
        env:
          MONGO_URI: mongodb://localhost:27017/skillswap_test
          JWT_SECRET: test_jwt_secret_for_ci_only_minimum_32_chars_long
          REFRESH_TOKEN_SECRET: test_refresh_secret_different_from_jwt_for_ci

  test-client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: client

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci

      - name: Lint client
        run: npm run lint

      - name: Build client
        run: npm run build
        env:
          VITE_API_URL: ""

  build-monolith-docker:
    needs: [test-server, test-client]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production monolith image (the one used by Railway)
        run: |
          docker build -t skillswap-monolith:ci .

      - name: Verify built image
        run: |
          docker images | grep skillswap-monolith
          echo "Docker build successful for SkillSwap monolith"
